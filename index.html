<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estadios del Mundo · Mapa sonoro</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <!-- Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
  <header>
    <div class="header-text">
      <h1>⚽ Estadios más importantes del mundo</h1>
      <p>Haz click en un estadio del mapa para escuchar a su hinchada. El volumen del festejo crece con la capacidad del estadio.</p>
    </div>
    <div class="header-actions">
      <!-- Botón para conectar el Arduino (servo). Oculto por ahora; ver README, sección "Integración con Arduino" para reactivarlo. -->
      <!-- <button id="btn-arduino" class="theme-btn" title="Conectar la maqueta (servo por USB)">🔌 Conectar Arduino</button> -->
      <button id="btn-theme" class="theme-btn" title="Cambiar modo claro/oscuro">🌙 Modo oscuro</button>
    </div>
  </header>

  <!-- Componente único: el mapa ocupa todo y el ranking va fijo a la izquierda -->
  <div class="stage">
    <div id="map"></div>
    <!-- Fotos de estadio superpuestas al mapa (posicionadas por app.js) -->
    <div id="stadium-images"></div>

    <!-- Panel del ranking a la izquierda, altura completa, fondo transparente -->
    <div class="side-panel" id="ranking-panel">
      <div class="panel-head">
        <h2>Ranking de estadios</h2>
      </div>
      <div class="controls">
        <label for="filter-confederation">Mostrar:</label>
        <select id="filter-confederation" class="filter-select" title="Filtrar estadios por confederación"></select>
      </div>
      <div id="bar"></div>
    </div>

    <!-- Estado del sonido, superpuesto abajo -->
    <div id="now-playing">🔇 Ningún estadio sonando. Haz click en un punto del mapa.</div>

    <!-- Estado de la conexión con el Arduino / servo. Oculto por ahora; ver README para reactivarlo junto con el botón. -->
    <!-- <div id="arduino-status">🔌 Arduino sin conectar.</div> -->
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="arduino.js"></script>
</body>
</html>
